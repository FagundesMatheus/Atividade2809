name: Continuous Integration

on:
  pull_request:
    branches: [ "develop", "main" ]
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  multiplatform-validation:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry Virtualenv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('backend/poetry.lock') }}

      - name: Install Dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        working-directory: ./backend
        run: poetry install --no-interaction

      - name: Run Ruff Linter
        working-directory: ./backend
        run: poetry run ruff check .

      - name: Run Ruff Formatter (Check)
        working-directory: ./backend
        run: poetry run ruff format --check .

      - name: Run Mypy
        working-directory: ./backend
        run: poetry run mypy src/ tests/

      - name: Run Pytest with Coverage
        working-directory: ./backend
        run: poetry run pytest --cov=src --cov-report=term-missing --cov-fail-under=80 tests/

  staging:
    name: Build staging package
    runs-on: ubuntu-latest
    needs: multiplatform-validation
    environment: staging
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Dependencies
        working-directory: ./backend
        run: poetry install --no-interaction

      - name: Build Staging Package
        working-directory: ./backend
        run: poetry build

  production-release:
    name: Publish production release
    runs-on: ubuntu-latest
    needs:
      - multiplatform-validation
      - staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Dependencies
        working-directory: ./backend
        run: poetry install --no-interaction

      - name: Build Production Package
        working-directory: ./backend
        run: poetry build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: backend/dist/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
