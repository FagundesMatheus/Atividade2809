repos:
  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^backend/
      - id: ruff-format
        files: ^backend/
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        args: [--config-file, backend/pyproject.toml]
        files: ^backend/
  - repo: local
    hooks:
      - id: backend-tests
        name: backend-tests
        entry: python -m pytest --cov=backend/src/nomeProjeto --cov-report=term-missing -c backend/pyproject.toml backend/tests
        language: system
        files: ^backend/
        pass_filenames: false
        always_run: true
        verbose: true  